;const notes=[392,494,587,494,440,523,659,523,392,494,587,784];$('music').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('music').textContent='♫ Music';return}audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();timer=setInterval(()=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=notes[seq++%notes.length];g.gain.setValueAtTime(.038,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.35);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.36)},440);$('music').textContent='♫ On'};sync();camera.position.set(0,4.4,45);$('loading').classList.add('hidden');intro();requestAnimationFrame(frame);
</script></body></html>
